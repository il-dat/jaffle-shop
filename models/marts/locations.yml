models:
  - name: locations
    description: Location overview data mart. One row per location.
    config:
      contract:
        enforced: true
    columns:
      - name: location_id
        description: The unique key of the locations mart.
        data_type: text
        constraints:
          - type: primary_key
            name: pk_locations
            warn_unenforced: false
        data_tests:
          - not_null
          - unique
      - name: location_name
        description: The name of the location.
        data_type: text
      - name: tax_rate
        description: The tax rate for the location.
        data_type: float
      - name: opened_date
        description: The date the location opened.
        data_type: timestamp_ntz

semantic_models:
  - name: locations
    description: |
      Location dimension table. The grain of the table is one row per location.
    model: ref('locations')
    defaults:
      agg_time_dimension: opened_date
    entities:
      - name: location
        type: primary
        expr: location_id
    dimensions:
      - name: location_name
        type: categorical
      - name: opened_date
        expr: opened_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: average_tax_rate
        description: Average tax rate.
        expr: tax_rate
        agg: average
